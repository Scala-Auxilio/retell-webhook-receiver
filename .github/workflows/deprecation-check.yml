name: Retell deprecation check

# Fails any push or PR that introduces an ACTUAL call to a deprecated Retell API
# endpoint or sets a deprecated agent-level field.
#
# v2 (2026-06-18) — rewritten after the v1 produced false positives:
#  - matched comments and historical migration notes
#  - matched the MIGRATED /v2/list-phone-numbers endpoint because the substring
#    "/list-phone-numbers" appears inside it.
#
# Detection strategy now:
#  - scan only executable code (.js, .ts), not docs or markdown
#  - skip pure-comment lines
#  - require the host "api.retellai.com" + deprecated path so we cannot
#    false-positive on the new /v2/* migrated endpoints
#  - also check for the 3 deprecated agent-config field names anywhere in
#    code that's setting them (object literals or assignments)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for actual deprecated Retell calls and fields
        run: |
          python3 - <<'PY'
          import os, re, sys

          # Deprecated endpoints — note paths are host-prefixed so we only match
          # api.retellai.com/<path> NOT api.retellai.com/v2/<path>.
          DEP_ENDPOINTS = [
              "/v2/list-calls",                       # -> /v3/list-calls
              "/list-chat",                           # -> POST /v3/list-chats
              "/list-phone-numbers",                  # -> /v2/list-phone-numbers
              "/list-retell-llms",                    # -> /v2/list-retell-llms
              "/list-conversation-flows",             # -> /v2/list-conversation-flows
              "/list-conversation-flow-components",   # -> /v2/list-...
              "/list-batch-tests",                    # -> /v2/list-batch-tests
              "/list-test-case-definitions",          # -> /v2/list-...
              "/list-test-runs",                      # -> /v2/list-test-runs (path prefix)
          ]
          # Host-anchored regexes — only match if the path follows api.retellai.com
          # directly. This is what makes /v2/list-phone-numbers (the NEW endpoint)
          # safe: the host is followed by /v2/, then /list-phone-numbers, so the
          # path is NOT directly after the host.
          ENDPOINT_RES = [re.compile(r'api\.retellai\.com' + re.escape(p) + r'(?![A-Za-z0-9_-])') for p in DEP_ENDPOINTS]

          # Deprecated agent-config fields — look for them as object keys or
          # assignment LHS, NOT as bare text in a comment or string.
          DEP_FIELDS = [
              "analysis_summary_prompt",
              "analysis_successful_prompt",
              "analysis_user_sentiment_prompt",
          ]
          FIELD_RES = [re.compile(r'(?:^|[\s,{(\[])' + re.escape(f) + r'\s*[:=]') for f in DEP_FIELDS]

          # Strip JS line comments and block comments before scanning.
          def strip_js_comments(src: str) -> str:
              # Remove /* ... */ block comments (lazy, single-line aware)
              src = re.sub(r'/\*[\s\S]*?\*/', '', src)
              # Remove // line comments (preserve newlines so line numbers stay aligned)
              return '\n'.join(re.sub(r'(^|[^:/])//.*$', r'\1', line) for line in src.split('\n'))

          fails = []
          for root, dirs, files in os.walk('.'):
              # skip junk
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules', 'dist', 'build', 'coverage')]
              for fname in files:
                  if not (fname.endswith('.js') or fname.endswith('.ts')): continue
                  # Skip the workflow if it ever ends up in here, and minified bundles.
                  if fname.endswith('.min.js'): continue
                  path = os.path.join(root, fname)
                  try:
                      raw = open(path, 'r', encoding='utf-8', errors='replace').read()
                  except OSError:
                      continue
                  stripped = strip_js_comments(raw)
                  for i, line in enumerate(stripped.split('\n'), 1):
                      for rx, p in zip(ENDPOINT_RES, DEP_ENDPOINTS):
                          if rx.search(line):
                              fails.append((path, i, f'endpoint {p}', line.strip()))
                      for rx, f in zip(FIELD_RES, DEP_FIELDS):
                          if rx.search(line):
                              fails.append((path, i, f'field {f}', line.strip()))

          if fails:
              print('::error::Deprecated Retell usage detected:')
              for path, ln, what, snippet in fails:
                  print(f'  {path}:{ln}  ({what})  >>  {snippet[:140]}')
              print()
              print('Migration table: https://docs.retellai.com/deprecation-notice/2026/06-15_legacy_list_endpoints')
              sys.exit(1)
          print('OK — no deprecated Retell endpoints or fields detected.')
          PY

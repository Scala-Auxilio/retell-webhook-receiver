name: Tests

# Runs the auth tests (tests/auth.test.js) on every push to main and every PR.
# No secrets, no database, no network beyond 127.0.0.1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm test
